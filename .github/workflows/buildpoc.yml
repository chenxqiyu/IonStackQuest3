# ============================================================
# Generic PoC builder — auto-detects the build system
# Builds BOTH arm64-v8a AND armeabi-v7a in a SINGLE job
# (sequential loop, not a matrix of two parallel jobs)
# Supports:
#   - CMake project          (CMakeLists.txt)
#   - Makefile project
#   - Plain C project        (no build files, e.g. bha-vin/CVE-2026-64600-Exploit)
#   - Script-only repo       (e.g. Detection.sh, just uploads)
# Compilers:
#   - gcc  (native Linux, single output)
#   - ndk  (Android cross-compile, arm64 + arm in one run)
# ============================================================
name: Build PoC (auto-detect, dual-ABI)

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'GitHub repo to clone (owner/repo or full URL)'
        required: true
        default: 'bha-vin/CVE-2026-64600-Exploit'
      compiler:
        description: 'Toolchain: gcc (Linux native) or ndk (Android cross)'
        required: false
        default: 'gcc'
        type: choice
        options:
          - gcc
          - ndk
      build_mode:
        description: 'auto (detect) / cmake / make / gcc / script'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - cmake
          - make
          - gcc
          - script
      ndk_version:
        description: 'Android NDK version (used when compiler=ndk)'
        required: false
        default: '27.0.12077973'
      api_level:
        description: 'Android API level (used when compiler=ndk)'
        required: false
        default: '26'

jobs:
  build-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ============================================================
      # Normalize the repo input
      # ============================================================
      - name: Normalize repo input
        run: |
          REPO="${{ inputs.repo }}"
          REPO="${REPO#https://github.com/}"
          REPO="${REPO#http://github.com/}"
          REPO="${REPO#git@github.com:}"
          REPO="${REPO%.git}"
          REPO="${REPO%/}"

          if ! echo "$REPO" | grep -qE '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "[!] Unrecognized repo format: '${{ inputs.repo }}'"
            echo "[!] Use owner/repo, e.g. bha-vin/CVE-2026-64600-Exploit"
            exit 1
          fi
          echo "[*] Using repo: $REPO"
          echo "REPO=$REPO" >> "$GITHUB_ENV"

      # ============================================================
      # Clone the repo
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}

      # ============================================================
      # Verify toolchain
      # ============================================================
      - name: Verify tools
        run: |
          gcc --version | head -1
          cmake --version | head -1 || true
          ninja --version || true

      # ============================================================
      # Optional: download Android NDK (compiler=ndk only)
      # ============================================================
      - name: Download Android NDK
        if: inputs.compiler == 'ndk'
        run: |
          NDK_VER="${{ inputs.ndk_version }}"
          case "$NDK_VER" in
            27.0.12077973) NDK_NAME="android-ndk-r27" ;;
            27.1.12297006) NDK_NAME="android-ndk-r27a" ;;
            27.2.12479018) NDK_NAME="android-ndk-r27c" ;;
            *)
              echo "[!] Unsupported NDK version: $NDK_VER"
              exit 1
              ;;
          esac
          wget -nv -O "$NDK_NAME-linux.zip" \
            "https://dl.google.com/android/repository/$NDK_NAME-linux.zip"
          unzip -q "$NDK_NAME-linux.zip" -d "$GITHUB_WORKSPACE/ndk"
          echo "NDK_HOME=$GITHUB_WORKSPACE/ndk/$NDK_NAME" >> "$GITHUB_ENV"
          rm -f "$NDK_NAME-linux.zip"

      # ============================================================
      # Detect build system (when build_mode=auto)
      # ============================================================
      - name: Detect build system
        id: detect
        run: |
          MODE="${{ inputs.build_mode }}"
          if [ "$MODE" = "auto" ]; then
            if [ -f CMakeLists.txt ]; then
              MODE=cmake
            elif [ -f Makefile ] || [ -f makefile ] || [ -f GNUmakefile ]; then
              MODE=make
            elif ls *.c >/dev/null 2>&1; then
              MODE=gcc
            else
              MODE=script
            fi
          fi
          echo "Detected build mode: $MODE"
          echo "MODE=$MODE" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Build — one step handles all modes, loops over ABIs
      #   gcc  : compile once, copy to dist/
      #   ndk  : loop arm64-v8a + armeabi-v7a, copy both to dist/
      # ============================================================
      - name: Build PoC (all modes, dual-ABI)
        run: |
          set -e
          mkdir -p dist
          MODE="${{ steps.detect.outputs.MODE }}"
          echo "[*] Build mode: $MODE | compiler: ${{ inputs.compiler }}"
          cd "$GITHUB_WORKSPACE"

          # ---------- helper: build with a given CC for gcc-mode C files
          build_c() {
            local CC="$1" TAG="$2"
            local SRC OUT
            SRC=$(ls *.c 2>/dev/null | head -1)
            if [ -z "$SRC" ]; then
              echo "[!] No .c file found in repo root"
              exit 1
            fi
            OUT="${SRC%.c}"
            echo "[*] [$TAG] Compiling $SRC -> $OUT with: $CC"
            "$CC" -O2 -Wall -o "$OUT" "$SRC" -lpthread
            [ -f "$OUT" ] || { echo "[!] [$TAG] build failed"; exit 1; }
            cp "$OUT" "dist/$OUT-$TAG"
            file "dist/$OUT-$TAG"
          }

          case "$MODE" in

            # ================= CMake =================
            cmake)
              if [ "${{ inputs.compiler }}" = "ndk" ]; then
                for VER in 27.0.12077973 26.1.10909125 25.2.9519653; do
                  DIR="$HOME/Library/Android/sdk/ndk/$VER"
                  mkdir -p "$(dirname "$DIR")"
                  [ -e "$DIR" ] || ln -s "$NDK_HOME" "$DIR"
                done
                # save pristine CMakeLists so we can re-patch per ABI
                cp CMakeLists.txt CMakeLists.orig
                for ABI in arm64-v8a armeabi-v7a; do
                  echo "[*] [CMake/$ABI] patching + building..."
                  cp CMakeLists.orig CMakeLists.txt
                  sed -i "s/arm64-v8a/$ABI/" CMakeLists.txt
                  sed -i "s/android-[0-9]*/android-${{ inputs.api_level }}/" CMakeLists.txt
                  cmake -B "build-$ABI" -G Ninja
                  cmake --build "build-$ABI"
                  # locate the produced binary (exe name unknown -> find ELF)
                  BIN=$(find "build-$ABI" -maxdepth 2 -type f -executable \
                        -exec sh -c 'head -c4 "$1" | grep -q $'"'"'\x7fELF'"'"' && echo "$1"' _ {} \; | head -1)
                  [ -n "$BIN" ] || { echo "[!] no ELF in build-$ABI"; exit 1; }
                  cp "$BIN" "dist/$(basename "$BIN")-$ABI"
                done
              else
                cmake -B build -G Ninja
                cmake --build build
                BIN=$(find build -maxdepth 2 -type f -executable \
                      -exec sh -c 'head -c4 "$1" | grep -q $'"'"'\x7fELF'"'"' && echo "$1"' _ {} \; | head -1)
                cp "$BIN" "dist/$(basename "$BIN")"
              fi
              ;;

            # ================= Makefile =================
            make)
              if [ "${{ inputs.compiler }}" = "ndk" ]; then
                for ABI in arm64-v8a armeabi-v7a; do
                  [ "$ABI" = "arm64-v8a" ] && TRIPLET=aarch64 || TRIPLET=armv7a
                  CC="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/$TRIPLET-linux-android${{ inputs.api_level }}-clang"
                  echo "[*] [make/$ABI] make CC=$CC"
                  make clean >/dev/null 2>&1 || true
                  make CC="$CC" -j2
                  BIN=$(find . -maxdepth 1 -type f -executable -name '!*.sh' \
                        -exec sh -c 'head -c4 "$1" | grep -q $'"'"'\x7fELF'"'"' && echo "$1"' _ {} \; | head -1)
                  cp "$BIN" "dist/$(basename "$BIN")-$ABI"
                done
              else
                make -j2
                BIN=$(find . -maxdepth 1 -type f -executable -name '!*.sh' \
                      -exec sh -c 'head -c4 "$1" | grep -q $'"'"'\x7fELF'"'"' && echo "$1"' _ {} \; | head -1)
                cp "$BIN" "dist/$(basename "$BIN")"
              fi
              ;;

            # ================= Plain C =================
            gcc)
              if [ "${{ inputs.compiler }}" = "ndk" ]; then
                build_c "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${{ inputs.api_level }}-clang" arm64-v8a
                build_c "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi${{ inputs.api_level }}-clang" armeabi-v7a
              else
                build_c gcc linux
              fi
              ;;

            # ================= Script-only =================
            script)
              echo "[*] No C/Make/CMake found — uploading repo files as-is"
              cp -r ./* dist/ 2>/dev/null || true
              chmod +x dist/*.sh 2>/dev/null || true
              ;;
          esac

          echo "[*] dist/ contents:"
          ls -la dist/

      # ============================================================
      # Upload everything from dist/
      # ============================================================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poc-bundle
          path: dist/*
          if-no-files-found: error
